name: Quick feedback
run-name: ${{ github.event_name == 'push' && 'Advisory Quick' || 'Preflight' }} / ${{ github.sha }} / ${{ inputs.base_sha || 'upstream-develop' }}
on:
  # Routine task pushes run only Fork A Quick (never the main-repo runner).
  push:
    branches: ['feature/**', 'feat/**', 'fix/**', 'refactor/**', 'perf/**', 'test/**', 'docs/**', 'chore/**', 'ci/**', 'experiment/**', 'spike/**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Exact comparison commit for manual diagnostics'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: quick-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  related:
    name: ${{ github.event_name == 'push' && 'Advisory Quick feedback' || 'Complete affected preflight' }}
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.repository.id == 1460097312 && github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/full/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'push' && 10 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/quality.yml
      - run: python3 -m pip install --disable-pip-version-check --retries 0 --timeout 30 Pillow==12.3.0
      - name: Pin upstream develop comparison for Fork A pushes
        id: comparison
        env:
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git -c credential.helper= -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --depth=1 --filter=blob:none --no-tags https://github.com/FurinyaWorks/Slay-the-Heavens.git refs/heads/develop
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          else
            BASE_SHA="$MANUAL_BASE_SHA"
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Fork Quick HEAD: %s, comparison BASE: %s\n' "$GITHUB_SHA" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact PR merge and comparison base
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ steps.comparison.outputs.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -c credential.helper= -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --depth=1 --no-auto-maintenance --no-tags origin "$BASE_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
      - name: Restore exact existing media for related consumers
        timeout-minutes: 2
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: node scripts/ci-media-lfs.mjs
      - name: Cheap governance and syntax preflight
        run: npm run check:guidance && npm run verify:backlog && npm run check:syntax
      - name: Validate versioned UI references
        run: node scripts/check-ui-references.mjs --hosted
      - name: Enforce existing changed Lua quality ratchet
        env:
          QUALITY_RATCHET_BASE: ${{ steps.comparison.outputs.sha }}
        run: node scripts/check-quality-ratchet.mjs
      - name: Advisory Quick feedback
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ steps.comparison.outputs.sha }}
          CI_LFS_TOKEN: ${{ github.token }}
          ABYSS_PYTHON: python3
        run: |
          printf '%s\n' 'Advisory fast JS and Lua subset only: 90s Lua scheduling estimate, 10-minute automatic job guard; integration and deferred Lua require formal Quality. This is not a complete preflight certificate.' >> "$GITHUB_STEP_SUMMARY"
          node scripts/test-affected.mjs --ci-fast --base "$BASE_SHA"
      - name: Complete affected JS and Lua preflight
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ steps.comparison.outputs.sha }}
          CI_LFS_TOKEN: ${{ github.token }}
          ABYSS_PYTHON: python3
        run: node scripts/test-affected.mjs --preflight --base "$BASE_SHA"
      - name: Record exact tested checkout
        if: github.event_name != 'push'
        run: node scripts/write-ci-receipt.mjs --preflight
        env:
          PREFLIGHT_BASE_SHA: ${{ steps.comparison.outputs.sha }}
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-checkout.json
          if-no-files-found: error
          retention-days: 7
