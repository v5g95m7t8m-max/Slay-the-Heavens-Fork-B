name: Performance regression
run-name: ${{ inputs.mode == 'formal' && format('Formal resource release / {0} / {1}', github.ref_name, github.sha) || github.workflow }}
on:
  push:
    branches: [experiment/sth-runtime-memory-attribution]
    paths:
      - '.github/workflows/performance-regression.yml'
      - 'experiments/runtime-memory/evidence/one-session-soak/run-capped.sh'
      - 'experiments/runtime-memory/evidence/one-session-soak/soak.mjs'
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/performance-regression.yml'
      - 'scripts/runtime-baseline/**'
      - 'scripts/build-native-candidate.mjs'
      - 'scripts/build-ui.mjs'
      - 'scripts/monster-art.mjs'
      - 'scripts/native-candidate-scripts.mjs'
      - 'scripts/official-assets-layout.mjs'
      - 'scripts/refined-release-monsters.mjs'
      - 'scripts/v220-battle-scene-geometry.mjs'
      - 'scripts/v220-chapter-battle-scenes.mjs'
      - 'scripts/viewport-layout.mjs'
      - 'data/presentation/native-monster-art.json'
      - 'data/presentation/ui_theme.json'
      - 'data/release/refined-monster-art.json'
      - 'src/lua/abyss_map_ui.lua'
      - 'src/lua/abyss_ui.lua'
      - 'src/lua/abyss_battle*.lua'
      - 'src/lua/abyss_actor_motion.lua'
      - 'src/lua/abyss_byrd_ground_trial.lua'
      - 'src/lua/abyss_card_flow.lua'
      - 'src/lua/abyss_chapter_battle_scene.lua'
      - 'src/lua/abyss_feedback.lua'
      - 'src/lua/abyss_feedback_actor_painter.lua'
      - 'src/lua/abyss_game_ui.lua'
      - 'src/lua/abyss_game_ui_view.lua'
      - 'src/lua/abyss_monster_art.lua'
      - 'src/lua/abyss_node_ui_input.lua'
      - 'src/lua/abyss_viewport.lua'
      - 'src/lua/abyss_deck*.lua'
      - 'src/lua/abyss_page_reveal.lua'
      - 'tests/benchmarks/resource-suite.test.mjs'
      - 'tests/release-performance*.test.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: Resource matrix depth, or formal for a frozen release or hotfix
        type: choice
        options: [fast, full, formal]
        default: full
      base_sha:
        description: Optional exact comparison commit for Fast or Full diagnostics.
        type: string
      gil_artifact_id:
        description: Archived GIL candidate artifact ID for the same frozen production source.
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: performance-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  performance:
    name: Offline Host resource diagnostics
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'push' || github.repository_id == '1460133275')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'formal' && 60 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify report and limit parser contracts
        run: node --test tests/benchmarks/resource-suite.test.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.mode == 'formal'
        with:
          repository: 8itlab/genshin-miliastra-mcp
          ref: 70470757d6fcb319c5afec13b178c87f2d8d54b3
          path: build/formal-native-reader
          persist-credentials: false
      - name: Build and measure the exact checkout
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          RESOURCE_MODE: ${{ github.event_name == 'pull_request' && 'fast' || inputs.mode }}
          GIL_ARTIFACT_ID: ${{ inputs.gil_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REPOSITORY_ID" = 1460133275
            test "$GITHUB_REF" = refs/heads/experiment/sth-runtime-memory-attribution
            bash experiments/runtime-memory/evidence/one-session-soak/run-capped.sh
            exit 0
          fi
          mode=${RESOURCE_MODE:-full}
          if [ "$mode" = formal ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY_ID" = 1429751262
            [[ "$GITHUB_REF" =~ ^refs/heads/(release|hotfix)/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test -z "$MANUAL_BASE_SHA"
            [[ "$GIL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          npm_flags=(--ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000)
          npm ci "${npm_flags[@]}"
          node --test tests/release-performance*.test.mjs
          BASE_SHA=${MANUAL_BASE_SHA:-${PR_BASE_SHA:-$(git rev-parse --verify HEAD^ 2>/dev/null || true)}}
          if [ "$mode" = formal ]; then
            git lfs install --local --skip-smudge
            native_reader="$PWD/build/formal-native-reader"
            (cd "$native_reader" && npm ci "${npm_flags[@]}")
            formal_inputs="$RUNNER_TEMP/formal-performance-gils"
            published=$(node scripts/runtime-baseline/frozen-performance-inputs.mjs "$formal_inputs")
            BASE_SHA=$(node -p 'JSON.parse(process.argv[1]).commit' "$published")
            BASE_TREE=$(node -p 'JSON.parse(process.argv[1]).tree' "$published")
          fi
          if [ -n "$BASE_SHA" ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "${BASE_SHA}^{commit}"; then
              git -c credential.helper= -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --depth=1 --no-tags origin "$BASE_SHA"
            fi
          fi
          if [ "$mode" = formal ]; then
            test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          fi
          prepare() {
            if [ "$mode" != formal ]; then
              npm run build:data
              npm run build:ui
            fi
          }
          args=(--mode "$mode")
          if [ "$mode" = formal ]; then
            args=(--mode full --production --extreme --release --candidate-gil "$formal_inputs/candidate.gil"
              --baseline-gil "$formal_inputs/baseline.gil" --native-reader "$native_reader")
          fi
          prepare
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:scripts/runtime-baseline/worker.mjs"; then
            reference="$RUNNER_TEMP/performance-reference"
            git worktree add --detach "$reference" "$BASE_SHA"
            (cd "$reference" && npm ci "${npm_flags[@]}" && prepare)
            args+=(--baseline "$reference")
            if [ "$mode" != formal ] && [ -z "$MANUAL_BASE_SHA" ]; then
              args+=(--baseline-if-compatible)
            fi
          elif [ "$mode" = formal ] || [ -n "$MANUAL_BASE_SHA" ]; then
            echo '::error::The specified reference does not contain the fixed Host workload.'
            exit 1
          elif [ -n "$BASE_SHA" ]; then
            echo '::warning::Reference has no fixed Host workload. Collecting candidate-only measurements.'
          fi
          node scripts/runtime-baseline/resource-suite.mjs "${args[@]}"
      - name: Bind formal resource report to audited GIL
        if: inputs.mode == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
          GIL_ARTIFACT_ID: ${{ inputs.gil_artifact_id }}
        run: node scripts/runtime-baseline/seal-release-performance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.mode == 'formal'
        with:
          name: release-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-performance/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance-regression/report.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'push' && github.repository_id == '1460133275' && github.ref == 'refs/heads/experiment/sth-runtime-memory-attribution'
        with:
          name: runtime-memory-capped-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/runtime-memory-capped-soak/*.txt
            build/runtime-memory-capped-soak/*.log
            build/runtime-memory-capped-soak/*.json
            build/runtime-memory-capped-soak/soak/identity.json
          if-no-files-found: error
          retention-days: 30
